name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv version --short)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION in pyproject.toml"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Installation

            ```toml
            [tool.uv.sources]
            beet-datapack-utils = { git = "https://github.com/Neluxx/beet-datapack-utils", tag = "${{ github.ref_name }}" }
            ```

            Then run `uv lock`. See the [changelog](https://github.com/Neluxx/beet-datapack-utils/blob/main/CHANGELOG.md) for what changed.
          files: dist/*
          fail_on_unmatched_files: true
