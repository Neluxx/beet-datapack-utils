[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "beet-datapack-utils"
version = "0.3.0"
description = "A Python library that provides helper functions for Minecraft datapacks using beet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Arndt", email = "fabian.arndt96@proton.me" }]
requires-python = ">=3.14"
keywords = [
    "minecraft",
    "datapack",
    "beet",
    "worldgen",
    "utility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "beet>=0.121.2",
]

[project.urls]
Repository = "https://github.com/Neluxx/beet-datapack-utils"
Issues = "https://github.com/Neluxx/beet-datapack-utils/issues"
Changelog = "https://github.com/Neluxx/beet-datapack-utils/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.build-backend]
source-include = [
    "tests/**",
    "docs/**",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
