[project]
name = "beet-datapack-utils"
version = "0.0.0"
description = "A Python library that provides helper functions for Minecraft datapacks using beet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Arndt" }]
requires-python = ">=3.14"
keywords = ["minecraft", "datapack", "beet", "worldgen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "beet>=0.119.0",
]

[project.urls]
Repository = "https://github.com/Neluxx/beet-datapack-utils"
Changelog = "https://github.com/Neluxx/beet-datapack-utils/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapack_utils"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
